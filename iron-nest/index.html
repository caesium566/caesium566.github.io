<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铁巢重炮 · 狙击计算器</title>
<style>
:root{--bg:#14171c;--panel:#1c2129;--line:#2c333d;--tx:#e6e9ee;--tx2:#9aa4b0;--tx3:#5c6672;--red:#e5484d;--amber:#f5a524;--green:#30a46c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:24px;max-width:860px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.sub{font-size:12px;color:var(--tx3);margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.sec{font-size:12px;color:var(--tx2);letter-spacing:2px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
input{width:100%;padding:8px 10px;background:#12151a;border:1px solid var(--line);border-radius:8px;color:var(--tx);font-size:15px;font-variant-numeric:tabular-nums}
input:focus{outline:none;border-color:var(--tx3)}
.out{display:flex;flex-wrap:wrap;gap:24px;align-items:baseline;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.item .l{font-size:12px;color:var(--tx2);margin-bottom:2px}
.item .v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.item .v small{font-size:14px;color:var(--tx2);font-weight:400}
.err{color:var(--red);font-size:13px;margin-top:10px;display:none}
.btn{padding:8px 18px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--tx);cursor:pointer;font-size:14px}
.btn.primary{background:var(--tx);color:#14171c;border-color:var(--tx);font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.row .id{font-weight:600;min-width:52px}
.row .dim{font-size:13px;color:var(--tx2)}
.row .cd{font-size:13px;color:var(--amber);font-weight:600;margin-left:auto}
.row .cd.fire{color:var(--red);animation:blink 1s infinite}
.row .cd.done{color:var(--tx3);animation:none}
@keyframes blink{50%{opacity:.35}}
.acts{display:flex;gap:6px}
.acts button{padding:3px 10px;font-size:12px;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--tx3);cursor:pointer}
.empty{font-size:13px;color:var(--tx3);padding:8px 0}
.hl{color:var(--tx);font-weight:600;font-size:14px;padding:1px 6px;border-radius:6px;background:#12151a;border:1px solid var(--line)}
.hint{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.7}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segbtn{flex:1;padding:8px 2px;background:transparent;border:none;color:var(--tx2);cursor:pointer;font-size:13px}
.segbtn.on{background:var(--tx);color:#14171c;font-weight:600}
.hint2{font-size:11px;color:var(--tx3);margin-top:5px;min-height:14px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
td,th{border:1px solid var(--line);padding:4px 6px;text-align:center;color:var(--tx2)}
th{color:var(--tx)}
tbody td{color:var(--tx)}
</style>
<base target="_blank">
</head>
<body>
<h1>铁巢重炮 · 狙击计算器</h1>
<div class="sub">仰角 = 距离 × 12 ÷ 装药量 · 飞行时间按速查表插值 · 发射时刻 = 目标到达时刻 − 飞行时间</div>

<div class="panel">
  <div class="sec">目标参数</div>
  <div class="grid">
    <div><label>目标编号</label><input id="fId" placeholder="如 A-07"></div>
    <div><label>方向角</label><input id="fDir" type="number" step="any" placeholder="0"></div>
    <div><label>距离（km）</label><input id="fDist" type="number" step="any" placeholder="3 ~ 20"></div>
    <div><label>装药量</label><div class="seg" id="segChg"><button class="segbtn on" data-v="min">最小装药</button><button class="segbtn" data-v="max">最大装药</button></div><div class="hint2" id="chgHint"></div></div>
    <div><label>目标到达时刻（选填）</label><input id="fArr" placeholder="HH:MM:SS 如 10:50:17"></div>
  </div>
  <div class="err" id="err"></div>
  <div class="out" id="out" style="display:none">
    <div class="item"><div class="l">装药量</div><div class="v" id="oChg" style="font-size:24px">—</div></div><div class="item"><div class="l">炮口仰角</div><div class="v" id="oElev">—</div></div>
    <div class="item"><div class="l">飞行时间</div><div class="v" id="oTime">—</div></div>
    <div class="item" id="oLaunchWrap" style="display:none"><div class="l">发射时刻</div><div class="v" id="oLaunch" style="color:var(--amber)">—</div></div>
    <span style="margin-left:auto;display:flex;gap:8px"><button class="btn" id="btnReset">清除参数</button><button class="btn primary" id="btnSave">保存这条</button></span>
  </div>
</div>

<div class="panel">
  <div class="sec" style="display:flex;align-items:center">任务列表 <span id="cnt" style="color:var(--tx3);letter-spacing:0;margin-left:8px"></span>
    <button class="btn" id="btnClear" style="margin-left:auto;padding:4px 12px;font-size:12px">清空</button></div>
  <div id="list"></div>
</div>

<div class="panel">
  <div class="sec">速查表（飞行时间，秒）</div>
  <div style="overflow-x:auto"><table id="tbl"></table></div>
  <div class="hint">各装药最大射程：药1 → 5km｜药2 → 10km｜药3 → 15km｜药4/5/6 → 20km。表格外距离按相邻两点线性插值，仰角恒等于 距离×12÷装药量。最小装药 = ⌈距离 ÷ 5⌉（保证仰角不超过 60°），可一键切最大装药 6 号。</div>
</div>

<script>
// 速查表：T[装药][射程km] = 飞行时间秒
var MAXR=[5,10,15,20,20,20];
var T={
1:{3:14,4:19,5:23},
2:{3:11,4:15,5:19,6:23,7:26.5,8:30,9:34,10:38},
3:{3:7,4:10,5:13,6:15,7:18,8:20,9:22.5,10:26,11:28,12:31,13:34,14:36.5,15:39},
4:{3:5,4:7,5:9,6:11,7:13,8:15,9:17,10:18.5,11:20,12:22,13:24,14:26,15:28,16:30,17:32,18:34,19:35.5,20:37},
5:{3:4,4:5.5,5:7,6:9,7:11,8:12.5,9:13.5,10:15,11:16,12:18,13:20,14:21,15:23,16:24,17:26,18:27,19:29,20:30},
6:{3:4,4:5,5:7,6:8,7:10,8:11,9:12,10:14,11:15,12:17,13:18,14:20,15:21,16:22,17:24,18:26,19:27,20:28}};
function flightTime(c,r){
  var tab=T[c];if(!tab||r<3||r>MAXR[c-1])return null;
  if(tab[r]!==undefined)return tab[r];
  var ks=Object.keys(tab).map(Number).sort(function(a,b){return a-b});
  for(var i=0;i<ks.length-1;i++){
    var a=ks[i],b=ks[i+1];
    if(r>a&&r<b)return tab[a]+(tab[b]-tab[a])*(r-a)/(b-a);
  }
  return null;
}
function parseT(s){
  var m=/^(\d{1,2}):(\d{2}):(\d{2})$/.exec((s||'').trim());
  if(!m)return null;
  return (+m[1])*3600+(+m[2])*60+(+m[3]);
}
function fmtT(sec){sec=((sec%86400)+86400)%86400;
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);
  function p(n){return (n<10?'0':'')+n}
  return p(h)+':'+p(m)+':'+p(s);
}
function $(id){return document.getElementById(id)}
var recs=[];try{recs=JSON.parse(localStorage.getItem('artRec2')||'[]')}catch(e){}
function persist(){try{localStorage.setItem('artRec2',JSON.stringify(recs))}catch(e){}}
function num(id){var v=parseFloat($(id).value);return isNaN(v)?null:v}
var chgMode='min';
function minChg(r){return Math.min(6,Math.max(1,Math.ceil(r/5)))}
function calc(){
  var r=num('fDist'),err='';
  if(r!==null&&r<3)err='最小射程 3km';
  else if(r!==null&&r>20)err='最大射程 20km';
  var c=(r!==null&&!err)?(chgMode==='max'?6:minChg(r)):null;
  var t=(c!==null)?flightTime(c,r):null;
  var elev=(c!==null)?r*12/c:null;
  var arr=parseT($('fArr').value);
  $('err').style.display=err?'block':'none';$('err').textContent=err;
  $('chgHint').textContent=(r!==null&&!err)?('距离 '+r+' km → 可打到的最小装药 '+minChg(r)+'，当前用 '+c+' 号药'+(chgMode==='min'?'（自动取最小）':'（固定最大）')):'';
  var show=(t!==null&&elev!==null);
  $('out').style.display=show?'flex':'none';
  if(!show)return null;
  $('oChg').innerHTML=c+'<small> 号</small>';
  $('oElev').innerHTML=elev.toFixed(2)+'<small>°</small>';
  $('oTime').innerHTML=t+'<small> 秒</small>';
  if(arr!==null){$('oLaunchWrap').style.display='block';$('oLaunch').textContent=fmtT(arr-t)}
  else $('oLaunchWrap').style.display='none';
  return{id:$('fId').value,r:r,c:c,dir:num('fDir'),elev:elev,t:t,arrS:arr!==null?fmtT(arr):null,launch:arr!==null?fmtT(arr-t):null};
}
['fId','fDist','fDir','fArr'].forEach(function(id){$(id).addEventListener('input',calc)});document.querySelectorAll('#segChg .segbtn').forEach(function(b){b.addEventListener('click',function(){chgMode=b.dataset.v;document.querySelectorAll('#segChg .segbtn').forEach(function(x){x.classList.toggle('on',x===b)});calc();});});
$('btnSave').addEventListener('click',function(){var o=calc();if(!o)return;recs.push(o);persist();render()});
$('btnReset').addEventListener('click',function(){
  ['fId','fDist','fDir','fChg','fArr'].forEach(function(id){$(id).value=''});
  calc();
});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function render(){
  var box=$('list');box.innerHTML='';
  $('cnt').textContent=recs.length?'（'+recs.length+' 条）':'';
  if(!recs.length){box.innerHTML='<div class="empty">还没有任务，算好一条点「保存这条」。</div>';return}
  recs.forEach(function(r,i){
    var d=document.createElement('div');d.className='row';
    d.innerHTML='<span class="id">'+esc(r.id||'—')+'</span>'
      +'<span class="dim">药 '+r.c+' · '+r.r+'km · </span>'+'<b class="hl">方向角 '+(r.dir==null?'—':r.dir)+'</b>'+'<span class="dim"> · </span>'+'<b class="hl">仰角 '+r.elev.toFixed(2)+'°</b>'+'<span class="dim"> · 飞行 '+r.t+'s</span>'
      +(r.arrS?'<span class="dim">到达 '+r.arrS+' → <b style="color:var(--amber)">'+r.launch+'</b> 发射</span>':'')
      +'<span class="cd" data-i="'+i+'"></span>'
      +'<span class="acts"><button data-a="copy">复制</button><button data-a="del">删除</button></span>';
    d.addEventListener('click',function(e){
      var a=e.target.dataset.a;
      if(a==='del'){recs.splice(i,1);persist();render();tick()}
      else if(a==='copy'){var txt='目标 '+r.id+'｜装药 '+r.c+'｜方向角 '+r.dir+'｜仰角 '+r.elev.toFixed(2)+'°｜飞行 '+r.t+'s'+(r.launch?'｜'+r.arrS+' 到达 → '+r.launch+' 发射':'');
        if(navigator.clipboard)navigator.clipboard.writeText(txt)}
    });
    box.appendChild(d);
  });
  tick();
}
function tick(){
  var now=Date.now();
  document.querySelectorAll('.cd').forEach(function(el){
    var r=recs[+el.dataset.i];if(!r||!r.arrS){el.textContent='';return}
    var arr=parseT(r.arrS);
    var d=new Date();d.setHours(0,0,0,0);
    var launchMs=d.getTime()+ (arr-r.t)*1000;
    var diff=(launchMs-now)/1000;
    if(diff>0){el.className='cd';el.textContent='T−'+Math.ceil(diff)+'s 开火'}
    else if(diff>-3){el.className='cd fire';el.textContent='开火！'}
    else{el.className='cd done';el.textContent='已发射'}
  });
}
setInterval(tick,500);
$('btnClear').addEventListener('click',function(){recs=[];persist();render()});
// 速查表
(function(){
  var h='<thead><tr><th>射程</th>';
  for(var c=1;c<=6;c++)h+='<th colspan="2">药 '+c+'</th>';
  h+='</tr><tr><th></th>';
  for(c=1;c<=6;c++)h+='<th>仰角</th><th>时间</th>';
  h+='</tr></thead><tbody>';
  for(var r=3;r<=20;r++){
    h+='<tr><th>'+r+'km</th>';
    for(c=1;c<=6;c++){
      if(r<=MAXR[c-1])h+='<td>'+(r*12/c).toFixed(2)+'</td><td>'+T[c][r]+'s</td>';
      else h+='<td>—</td><td>—</td>';
    }
    h+='</tr>';
  }
  $('tbl').innerHTML=h+'</tbody>';
})();
calc();render();
</script>
</body>
</html>
