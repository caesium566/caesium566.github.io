<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩墨管理与抽取</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; padding: 16px;
    background: #f5f5f5;
    color: #1a1a1a;
    line-height: 1.5;
  }
  .container { max-width: 640px; margin: 0 auto; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #ddd; margin-bottom: 16px; background: #fff; padding: 0 16px; border-radius: 10px 10px 0 0; position: sticky; top: 0; z-index: 100; }
  .tab { padding: 12px 20px; cursor: pointer; border: none; background: transparent; color: #666; font-size: 15px; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 500; }
  .tab:hover:not(.active) { color: #1a1a1a; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px; border: 1px solid #ddd;
    background: #fff; color: #1a1a1a; cursor: pointer; font-size: 14px;
    transition: all 0.15s; height: 36px; box-sizing: border-box;
  }
  .btn:hover { background: #f0f0f0; }
  .btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-danger { color: #c0392b; border-color: #c0392b; }
  .btn-danger:hover { background: #fdf2f2; }
  .btn-sm { padding: 5px 10px; font-size: 13px; }
  .btn-icon { padding: 6px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; position: sticky; top: 48px; z-index: 50; background: #f5f5f5; padding: 8px 0; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 12px; background: #fff; cursor: pointer; }
  .card:hover { border-color: #bbb; }
  .ink-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; }
  .ink-row:last-child { border-bottom: none; }
  .ink-color-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.1); }
  .ink-info { flex: 1; min-width: 0; }
  .ink-brand { font-size: 14px; font-weight: 500; cursor: pointer; }
  .ink-brand:hover { text-decoration: underline; }
  .ink-meta { font-size: 12px; color: #888; margin-top: 2px; }
  .ink-status { font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
  .status-active { background: #e8f5e9; color: #2e7d32; }
  .status-used { background: #f5f5f5; color: #888; }
  .row-actions { display: flex; gap: 4px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 17px; font-weight: 500; margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  .form-input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #1a1a1a; font-size: 14px; }
  .form-input:focus { outline: none; border-color: #1a1a1a; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .draw-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .draw-card-title { font-size: 15px; font-weight: 500; }
  .draw-card-meta { font-size: 12px; color: #888; }
  .progress-bar { height: 4px; background: #eee; border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: #1a1a1a; border-radius: 2px; transition: width 0.3s; }
  .draw-list-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 8px; cursor: pointer; background: #fff; transition: all 0.15s; }
  .draw-list-item:hover { border-color: #ccc; }
  .draw-list-item.checked { opacity: 0.5; background: #f9f9f9; }
  .draw-list-item.checked .ink-brand { text-decoration: line-through; color: #888; }
  .checkbox { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 16px; font-weight: 500; }
  .draw-list-item.checked .checkbox { color: #2e7d32; }
  .empty-state { text-align: center; padding: 40px 20px; color: #888; }
  .ink-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; max-height: 200px; overflow-y: auto; padding: 4px; }
  .ink-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; cursor: pointer; background: #fff; transition: all 0.15s; }
  .ink-chip.selected { border-color: #1a1a1a; background: #f0f0f0; }
  .ink-chip:hover { border-color: #999; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px; color: #666; cursor: pointer; font-size: 14px; border: none; background: none; padding: 4px 0; }
  .back-btn:hover { color: #1a1a1a; }
  .stats { display: flex; gap: 16px; font-size: 14px; color: #888; align-items: center; }
  .hidden { display: none !important; }
  .panel { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #ddd; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 640px; margin: 0 auto; }
  .grid-2 .card { margin-bottom: 0; }
  @media (max-width: 640px) {
    .grid-2 { grid-template-columns: 1fr; }
  }
  .version-tag { font-size: 11px; color: #bbb; margin-left: 8px; }
  h2 { font-size: 18px; font-weight: 500; margin: 0 0 12px 0; }
  .note-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #1a1a1a; margin-left: 6px; vertical-align: middle; }
  .note-display { margin-top: 8px; padding: 10px 12px; background: #f9f9f9; border-radius: 8px; font-size: 13px; color: #555; border-left: 3px solid #1a1a1a; }
  .note-display:empty { display: none; }
  .data-actions { display: flex; gap: 8px; margin-bottom: 16px; }
  .import-input { display: none; }
  .date-row { display: flex; gap: 8px; }
  .date-row .form-input { flex: 1; }
  .filter-sort-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .filter-sort-bar .form-input { width: auto; min-width: 100px; flex: 1; }
  .option-group { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .option-group-title { font-size: 13px; color: #666; margin-bottom: 8px; font-weight: 500; }
  .option-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; cursor: pointer; }
  .option-item:last-child { margin-bottom: 0; }
  .option-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .card, .panel { padding: 12px; }
    .tab { padding: 10px 14px; font-size: 14px; }
    .filter-sort-bar { flex-direction: column; }
    .filter-sort-bar .form-input { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="tabs">
    <button class="tab active" id="tab-draws" data-tab="draws">抽取中心</button>
    <button class="tab" id="tab-inventory" data-tab="inventory">彩墨管理</button>
    <button class="tab" id="tab-pens" data-tab="pens">钢笔管理</button>
    <button class="tab" id="tab-papers" data-tab="papers">纸张管理</button>
    <button class="tab" id="tab-notebooks" data-tab="notebooks">本子管理</button>
  </div>

  <div id="view-draws" class="hidden">
    <div class="toolbar">
      <div class="stats" id="draw-stats"></div>
      <button class="btn btn-primary" id="btn-add-draw">+ 新建抽取</button>
    </div>
    <div id="draw-list"></div>
  </div>

  <div id="view-draw-detail" class="hidden">
    <button class="back-btn" id="btn-back">&larr; 返回抽取列表</button>
    <div class="draw-card-header" style="margin-bottom: 16px;">
      <div>
        <div class="draw-card-title" id="detail-title"></div>
        <div class="draw-card-meta" id="detail-meta"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm" id="btn-refresh">&#8634; 刷新排序</button>
        <button class="btn btn-sm" id="btn-reset">&#8635; 重置进度</button>
        <button class="btn btn-sm" id="btn-export-draw">&#11015; 导出记录</button>
        <button class="btn btn-sm btn-danger" id="btn-delete-draw">删除</button>
      </div>
    </div>
    <div class="progress-bar" style="margin-bottom: 16px;">
      <div class="progress-fill" id="detail-progress" style="width: 0%"></div>
    </div>
    <div id="detail-list"></div>
  </div>

  <div id="view-inventory">
    <div class="toolbar">
      <div class="stats">
        <span id="stat-total">共 0 瓶</span>
        <span id="stat-active">在用 0</span>
        <span id="stat-used">用完 0</span>
      </div>
      <button class="btn btn-primary" id="btn-add-ink">+ 添加彩墨</button>
    </div>
    <div class="data-actions">
      <button class="btn btn-sm" id="btn-export">&#11015; 导出数据</button>
      <button class="btn btn-sm" id="btn-import">&#11014; 导入数据</button>
      <input type="file" class="import-input" id="import-file" accept=".json">
    </div>
    <div class="filter-sort-bar">
      <select class="form-input" id="filter-family">
        <option value="">全部颜色系</option>
        <option value="red">红</option>
        <option value="orange">橙</option>
        <option value="yellow">黄</option>
        <option value="green">绿</option>
        <option value="blue">蓝</option>
        <option value="purple">紫</option>
        <option value="brown">棕黑</option>
        <option value="bw">灰白</option>
      </select>
      <select class="form-input" id="filter-brand">
        <option value="">全部品牌</option>
      </select>
      <select class="form-input" id="sort-mode">
        <option value="default">默认</option>
        <option value="date-desc">购买日期 &darr; 最新</option>
        <option value="date-asc">购买日期 &uarr; 最早</option>
      </select>
    </div>
    <div id="ink-list"></div>
  </div>

  <div id="view-papers" class="hidden">
    <div class="toolbar">
      <div class="stats" id="paper-stats"></div>
      <button class="btn btn-primary" id="btn-add-paper">+ 添加纸张</button>
    </div>
    <div id="paper-list"></div>
  </div>

  <div id="view-pens" class="hidden">
    <div class="toolbar">
      <div class="stats" id="pen-stats"></div>
      <button class="btn btn-primary" id="btn-add-pen">+ 添加钢笔</button>
    </div>
    <div id="pen-list"></div>
  </div>

  <div id="view-notebooks" class="hidden">
    <div class="toolbar">
      <div class="stats" id="notebook-stats"></div>
      <button class="btn btn-primary" id="btn-add-notebook">+ 添加本子</button>
    </div>
    <div id="notebook-list" class="grid-2"></div>
  </div>
</div>

<div style="text-align:center;padding:20px 16px;color:#bbb;font-size:12px;">
  彩墨管理与抽取工具 v2.3
</div>

<div id="modal-ink" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="ink-modal-title">添加彩墨</div>
    <div class="form-group">
      <label class="form-label">颜色系</label>
      <select class="form-input" id="ink-family">
        <option value="">-- 请选择 --</option>
        <option value="red">红</option>
        <option value="orange">橙</option>
        <option value="yellow">黄</option>
        <option value="green">绿</option>
        <option value="blue">蓝</option>
        <option value="purple">紫</option>
        <option value="brown">棕黑</option>
        <option value="bw">灰白</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">颜色名称</label>
      <input class="form-input" id="ink-color" placeholder="例如：露草、山葡萄、野草莓">
    </div>
    <div class="form-group">
      <label class="form-label">品牌</label>
      <select class="form-input" id="ink-brand-select">
        <option value="">-- 选择已有品牌 --</option>
        <option value="__new__">+ 新增品牌</option>
      </select>
      <input class="form-input" id="ink-brand-input" placeholder="输入新品牌" style="margin-top:8px; display:none;">
    </div>
    <div class="form-group">
      <label class="form-label">日期与存量记录</label>
      <div id="ink-history-list"></div>
      <button class="btn btn-sm" type="button" id="btn-add-history" style="margin-top:8px;">+ 添加记录</button>
    </div>
    <div class="form-group">
      <label class="form-label">评价条目</label>
      <div id="ink-reviews-list"></div>
      <button class="btn btn-sm" type="button" id="btn-add-ink-review" style="margin-top:8px;">+ 添加评价</button>
    </div>

    <div class="form-group">
      <label class="form-label">当前状态</label>
      <select class="form-input" id="ink-status">
        <option value="active">在用</option>
        <option value="used">用完</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn" id="btn-cancel-ink">取消</button>
      <button class="btn btn-primary" id="btn-save-ink">保存</button>
    </div>
  </div>
</div>

<div id="modal-notebook" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="notebook-modal-title">添加本子</div>
    <div class="form-group">
      <label class="form-label">本子代号</label>
      <input class="form-input" id="notebook-code" placeholder="例如：D-A5-001">
    </div>
    <div class="form-group">
      <label class="form-label">品牌</label>
      <input class="form-input" id="notebook-brand" placeholder="例如：MD、国誉">
    </div>
    <div class="form-group">
      <label class="form-label">名称</label>
      <input class="form-input" id="notebook-name" placeholder="例如：余白、Campus">
    </div>
    <div class="form-group">
      <label class="form-label">型号</label>
      <input class="form-input" id="notebook-model" placeholder="例如：A5点阵、A6方格">
    </div>
    <div class="form-group">
      <label class="form-label">使用的纸张（联动纸张管理）</label>
      <div class="ink-selector" id="notebook-paper-selector"></div>
    </div>
    <div class="form-group">
      <label class="form-label">使用起止时间</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input class="form-input" id="notebook-start" placeholder="2025-06-01" style="flex:1;">
        <span style="color:#888;">~</span>
        <input class="form-input" id="notebook-end" placeholder="2026-08-06" style="flex:1;">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">照片</label>
      <input type="file" class="form-input" id="notebook-photo" accept="image/*" style="padding:6px 12px;">
      <div id="notebook-photo-preview" style="margin-top:8px;max-width:200px;max-height:150px;overflow:hidden;border-radius:8px;display:none;">
        <img id="notebook-photo-img" style="width:100%;height:auto;display:block;">
      </div>
      <div style="font-size:12px;color:#888;margin-top:4px;">提示：照片转base64存本地，容量有限建议只存缩略图</div>
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <textarea class="form-input" id="notebook-note" rows="2" placeholder="其他补充信息"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn" id="btn-cancel-notebook">取消</button>
      <button class="btn btn-primary" id="btn-save-notebook">保存</button>
    </div>
  </div>
</div>

<div id="modal-paper" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="paper-modal-title">添加纸张</div>
    <div class="form-group">
      <label class="form-label">品牌</label>
      <input class="form-input" id="paper-brand" placeholder="例如：巴川、国誉、道林">
    </div>
    <div class="form-group">
      <label class="form-label">纸种类</label>
      <input class="form-input" id="paper-type" placeholder="例如：轻型纸、铜版纸、书写纸">
    </div>
    <div class="form-group">
      <label class="form-label">克重</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input class="form-input" type="number" id="paper-weight" placeholder="52" style="flex:1;">
        <span style="color:#888;font-size:14px;">g/m²</span>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">使用的本子（自动关联）</label>
      <div id="paper-notebooks-display" style="font-size:13px;color:#555;padding:8px 0;">未关联本子</div>
    </div>
    <div class="form-group">
      <label class="form-label">评价条目</label>
      <div id="paper-reviews-list"></div>
      <button class="btn btn-sm" type="button" id="btn-add-review" style="margin-top:8px;">+ 添加评价</button>
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <textarea class="form-input" id="paper-note" rows="2" placeholder="其他补充信息"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn" id="btn-cancel-paper">取消</button>
      <button class="btn btn-primary" id="btn-save-paper">保存</button>
    </div>
  </div>
</div>

<div id="modal-pen" class="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="pen-modal-title">添加钢笔</div>
    <div class="form-group">
      <label class="form-label">品牌</label>
      <input class="form-input" id="pen-brand" placeholder="例如：百乐、凌美、写乐">
    </div>
    <div class="form-group">
      <label class="form-label">名称</label>
      <input class="form-input" id="pen-name" placeholder="例如：78G、狩猎者、四季织">
    </div>
    <div class="form-group">
      <label class="form-label">笔尖粗细</label>
      <input class="form-input" id="pen-nib" placeholder="例如：EF、F、M、B">
    </div>
    <div class="form-group">
      <label class="form-label">价格</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input class="form-input" type="number" id="pen-price" placeholder="150" style="flex:1;">
        <span style="color:#888;font-size:14px;">元</span>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">灌的墨水</label>
      <select class="form-input" id="pen-ink-select">
        <option value="">-- 不灌墨 --</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">评价条目</label>
      <div id="pen-reviews-list"></div>
      <button class="btn btn-sm" type="button" id="btn-add-pen-review" style="margin-top:8px;">+ 添加评价</button>
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <textarea class="form-input" id="pen-note" rows="2" placeholder="其他补充信息"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn" id="btn-cancel-pen">取消</button>
      <button class="btn btn-primary" id="btn-save-pen">保存</button>
    </div>
  </div>
</div>

<div id="modal-draw" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">新建抽取排序</div>
    <div class="form-group">
      <label class="form-label">抽取名称</label>
      <input class="form-input" id="draw-name" placeholder="例如：2025年夏季绘画">
    </div>
    <div class="form-group">
      <label class="form-label">选择参与抽取的彩墨（<span id="selected-count">0</span> 瓶已选）</label>
      <div class="ink-selector" id="draw-ink-selector"></div>
    </div>

    <div class="form-actions">
      <button class="btn" id="btn-cancel-draw">取消</button>
      <button class="btn btn-primary" id="btn-create-draw">创建并智能排序</button>
    </div>
  </div>
</div>

<script>
/* 彩墨管理与抽取应用 */
(function() {
  "use strict";

  var STORAGE_KEY = "ink_manager_data_v9";
  var data = { inks: [], draws: [], papers: [], pens: [], notebooks: [] };
  var currentTab = "inventory";
  var editingInkId = null;
  var currentDrawId = null;
  var selectedInkIds = [];
  var FAMILY_COLORS = {
    "red": "#c0392b",
    "orange": "#e67e22",
    "yellow": "#d4a017",
    "green": "#27ae60",
    "blue": "#2980b9",
    "purple": "#8e44ad",
    "brown": "#795548",
    "bw": "#2d3436"
  };

  var FAMILY_NAMES = {
    "red": "红", "orange": "橙", "yellow": "黄", "green": "绿",
    "blue": "蓝", "purple": "紫", "brown": "棕黑", "bw": "灰白"
  };

  var WARM_FAMILIES = ["red", "orange", "yellow"];
  var COOL_FAMILIES = ["blue", "green", "purple"];

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) data = JSON.parse(raw);
      // 数据迁移：为旧抽取补充 checkedAt 字段
      if (data.draws) {
        for (var i = 0; i < data.draws.length; i++) {
          var d = data.draws[i];
          if (!d.checkedAt) d.checkedAt = {};
          for (var j = 0; j < d.checked.length; j++) {
            var cid = d.checked[j];
            if (!d.checkedAt[cid]) d.checkedAt[cid] = d.createdAt || "";
          }
        }
      }
      // 数据迁移：旧墨水单条 purchaseDate/capacity 转为 history 数组
      if (data.inks) {
        for (var i = 0; i < data.inks.length; i++) {
          var ink = data.inks[i];
          if (!ink.history) {
            ink.history = [{
              label: "购买",
              date: ink.purchaseDate || "",
              capacity: ink.capacity || ""
            }];
            delete ink.purchaseDate;
            delete ink.capacity;
          }
          if (ink.note && ink.note.trim() && (!ink.reviews || ink.reviews.length === 0)) {
            ink.reviews = [{ text: ink.note.trim(), starred: false }];
            delete ink.note;
          }
          if (!ink.reviews) ink.reviews = [];
        }
      }
      if (!data.papers) data.papers = [];
      if (!data.notebooks) data.notebooks = [];
      for (var i = 0; i < data.papers.length; i++) {
        var p = data.papers[i];
        if (p.notebook && !p.notebooks) {
          p.notebooks = [p.notebook];
          delete p.notebook;
        }
        if (p.reviews && p.reviews.length > 0 && typeof p.reviews[0] === "string") {
          var newReviews = [];
          for (var j = 0; j < p.reviews.length; j++) {
            newReviews.push({ text: p.reviews[j], starred: false });
          }
          p.reviews = newReviews;
        }
      }
      if (!data.pens) data.pens = [];
      for (var i = 0; i < data.pens.length; i++) {
        var pen = data.pens[i];
        if (pen.reviews && pen.reviews.length > 0 && typeof pen.reviews[0] === "string") {
          var newReviews = [];
          for (var j = 0; j < pen.reviews.length; j++) {
            newReviews.push({ text: pen.reviews[j], starred: false });
          }
          pen.reviews = newReviews;
        }
      }
      if (data.inks) {
        for (var i = 0; i < data.inks.length; i++) {
          var ink = data.inks[i];
          if (ink.reviews && ink.reviews.length > 0 && typeof ink.reviews[0] === "string") {
            var newReviews = [];
            for (var j = 0; j < ink.reviews.length; j++) {
              newReviews.push({ text: ink.reviews[j], starred: false });
            }
            ink.reviews = newReviews;
          }
          if (!ink.reviews) ink.reviews = [];
        }
      }
      if (!data.notebooks) data.notebooks = [];
    } catch(e) {}
  }

  }

  function colorToCss(colorName) {
    var map = {
      "红":"#c0392b","赤":"#c0392b","朱":"#e74c3c","丹":"#e74c3c",
      "橙":"#e67e22","橘":"#e67e22","黄":"#f1c40f","金":"#f1c40f",
      "绿":"#27ae60","翠":"#2ecc71","青":"#16a085","蓝":"#2980b9",
      "靛":"#8e44ad","紫":"#8e44ad","葡萄":"#9b59b6","粉":"#e84393",
      "桃":"#fd79a8","棕":"#795548","褐":"#795548","茶":"#8d6e63",
      "黑":"#2d3436","墨":"#2d3436","灰":"#636e72","银":"#b2bec3","白":"#dfe6e9"
    };
    for (var key in map) { if (colorName.indexOf(key) !== -1) return map[key]; }
    var hash = 0;
    for (var i = 0; i < colorName.length; i++) {
      hash = colorName.charCodeAt(i) + ((hash << 5) - hash);
    }
    return "hsl(" + (Math.abs(hash) % 360) + ",60%,45%)";
  }

  function parseDate(dateStr) {
    if (!dateStr) return null;
    var m = dateStr.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/);
    if (!m) return null;
    return {
      year: m[1],
      month: String(parseInt(m[2], 10)).padStart(2, "0"),
      day: m[3] ? String(parseInt(m[3], 10)).padStart(2, "0") : ""
    };
  }

  function formatDate(dateStr) {
    if (!dateStr) return "未记录";
    var parsed = parseDate(dateStr);
    if (!parsed) return dateStr;
    if (parsed.day) return parsed.year + "-" + parsed.month + "-" + parsed.day;
    return parsed.year + "-" + parsed.month;
  }

  function normalizeDate(dateStr) {
    var parsed = parseDate(dateStr);
    if (!parsed) return "";
    if (parsed.day) return parsed.year + "-" + parsed.month + "-" + parsed.day;
    return parsed.year + "-" + parsed.month;
  }

  function parseDateToNum(dateStr) {
    if (!dateStr) return 0;
    var parsed = parseDate(dateStr);
    if (!parsed) return 0;
    var s = parsed.year + parsed.month + (parsed.day || "00");
    return parseInt(s, 10) || 0;
  }

  function parseCapacity(cap) {
    if (!cap) return 0;
    var num = parseFloat(String(cap).replace(/[^0-9.]/g, ""));
    return isNaN(num) ? 0 : num;
  }

  function formatCapacity(cap) {
    if (!cap) return "-";
    var num = parseCapacity(cap);
    if (num > 0) return num + "ml";
    return String(cap);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function smartSort(inkIds) {
    // 按色系分组
    var groups = {};
    for (var i = 0; i < inkIds.length; i++) {
      var f = getFamily(inkIds[i]);
      if (!groups[f]) groups[f] = [];
      groups[f].push(inkIds[i]);
    }

    // 每个色系内随机打乱
    for (var f in groups) {
      var arr = groups[f];
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
    }

    // 获取所有有墨水的色系，随机确定初始循环顺序
    var families = Object.keys(groups);
    for (var i = families.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = families[i]; families[i] = families[j]; families[j] = tmp;
    }

    var result = [];

    while (families.length > 0) {
      var nextFamilies = [];
      // 按当前色系顺序一轮循环
      for (var i = 0; i < families.length; i++) {
        var f = families[i];
        if (groups[f] && groups[f].length > 0) {
          result.push(groups[f].shift());
          nextFamilies.push(f);
        }
      }
      families = nextFamilies;
      // 轮换：把第一个色系移到最后
      if (families.length > 1) {
        var first = families.shift();
        families.push(first);
      }
    }

    return result;
  }

    });
  }

  function isLeapYear(y) {
    return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
  }

  function getDaysInMonth(year, month) {
    if (!year || !month) return 31;
    var y = parseInt(year, 10);
    var m = parseInt(month, 10);
    var days = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    if (m === 2 && isLeapYear(y)) return 29;
    return days[m - 1];
  }

  
  
  
  
  
  function getUniqueBrands() {
    var brands = [];
    var seen = {};
    for (var i = 0; i < data.inks.length; i++) {
      var b = data.inks[i].brand;
      if (b && !seen[b]) {
        seen[b] = true;
        brands.push(b);
      }
    }
    brands.sort(function(a, b) { return a.localeCompare(b, "zh-CN"); });
    return brands;
  }

  function getFilteredAndSortedInks() {
    var familyFilter = $("filter-family").value;
    var brandFilter = $("filter-brand").value;
    var sortMode = $("sort-mode").value;

    var result = data.inks.slice();

    if (familyFilter) {
      result = result.filter(function(ink) { return ink.colorFamily === familyFilter; });
    }
    if (brandFilter) {
      result = result.filter(function(ink) { return ink.brand === brandFilter; });
    }

    if (sortMode === "date-desc") {
      result.sort(function(a, b) { return parseDateToNum((getLatestPurchaseHistory(b) || {}).date) - parseDateToNum((getLatestPurchaseHistory(a) || {}).date); });
    } else if (sortMode === "date-asc") {
      result.sort(function(a, b) { return parseDateToNum((getLatestPurchaseHistory(a) || {}).date) - parseDateToNum((getLatestPurchaseHistory(b) || {}).date); });
    }

    return result;
  }

  function getLatestHistory(ink) {
    if (ink.history && ink.history.length > 0) {
      return ink.history[ink.history.length - 1];

  }

  function getLatestPurchaseHistory(ink) {
    if (!ink.history || ink.history.length === 0) return { label: "", date: "", capacity: "" };
    var purchaseRecs = ink.history.filter(function(r) { return r.label === "购买"; });
    if (purchaseRecs.length === 0) return { label: "", date: "", capacity: "" };
    // 按日期排序，取最新
    purchaseRecs.sort(function(a, b) { return parseDateToNum(b.date) - parseDateToNum(a.date); });
    return purchaseRecs[0];
  }

function openInkModal(id) {
    editingInkId = id || null;
    updateBrandSelect();
    $("ink-modal-title").textContent = id ? "编辑彩墨" : "添加彩墨";
    if (id) {
      var ink = data.inks.find(function(i) { return i.id === id; });
      $("ink-family").value = ink.colorFamily || "";
      $("ink-color").value = ink.color;

      var brands = getUniqueBrands();
      if (ink.brand && brands.indexOf(ink.brand) !== -1) {
        $("ink-brand-select").value = ink.brand;
        $("ink-brand-input").style.display = "none";
      } else {
        $("ink-brand-select").value = "__new__";
        $("ink-brand-input").style.display = "block";
        $("ink-brand-input").value = ink.brand || "";
      }

      inkHistoryRecords = ink.history && ink.history.length > 0 ? JSON.parse(JSON.stringify(ink.history)) : [];
      inkReviewRecords = [];
      if (ink.reviews && ink.reviews.length > 0) {
        for (var i = 0; i < ink.reviews.length; i++) {
          var rec = ink.reviews[i];
          if (typeof rec === "string") {
            inkReviewRecords.push({ text: rec, starred: false });
          } else if (rec) {
            inkReviewRecords.push({ text: rec.text || "", starred: !!rec.starred });
          }
        }
      }
      $("ink-status").value = ink.status;

  // ===== 拖拽排序 =====
  function setupDragSort(container, dataArray, idField, onReorder) {
    if (!container) return;
    var draggedId = null;
    var items = container.querySelectorAll("[data-drag-id]");

    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      item.draggable = true;

      item.addEventListener("dragstart", function(e) {
        draggedId = this.getAttribute("data-drag-id");
        this.style.opacity = "0.4";
        e.dataTransfer.effectAllowed = "move";
      });

      item.addEventListener("dragend", function() {
        this.style.opacity = "1";
        draggedId = null;
        var all = container.querySelectorAll("[data-drag-id]");
        for (var j = 0; j < all.length; j++) {
          all[j].style.borderTop = "";
          all[j].style.borderBottom = "";
        }
      });

      item.addEventListener("dragover", function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (!draggedId || draggedId === this.getAttribute("data-drag-id")) return;
        var rect = this.getBoundingClientRect();
        var midY = rect.top + rect.height / 2;
        if (e.clientY < midY) {
          this.style.borderTop = "2px solid #1a1a1a";
          this.style.borderBottom = "";
        } else {
          this.style.borderTop = "";
          this.style.borderBottom = "2px solid #1a1a1a";
        }
      });

      item.addEventListener("dragleave", function() {
        this.style.borderTop = "";
        this.style.borderBottom = "";
      });

      item.addEventListener("drop", function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (!draggedId) return;
        var targetId = this.getAttribute("data-drag-id");
        if (draggedId === targetId) return;

        var rect = this.getBoundingClientRect();
        var midY = rect.top + rect.height / 2;
        var insertBefore = e.clientY < midY;

        var fromIdx = -1, toIdx = -1;
        for (var j = 0; j < dataArray.length; j++) {
          if (dataArray[j][idField] === draggedId) fromIdx = j;
          if (dataArray[j][idField] === targetId) toIdx = j;
        }
        if (fromIdx === -1 || toIdx === -1) return;

        var itemData = dataArray.splice(fromIdx, 1)[0];
        var newIdx = insertBefore ? toIdx : toIdx + 1;
        if (fromIdx < toIdx && !insertBefore) newIdx--;
        dataArray.splice(newIdx, 0, itemData);

        saveData();
        if (onReorder) onReorder();
      });
    }
  }

  function handleNotebookPhoto() {
    var fileInput = $("notebook-photo");
    var preview = $("notebook-photo-preview");
    var img = $("notebook-photo-img");
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) return;
    var file = fileInput.files[0];
    var reader = new FileReader();
    reader.onload = function(e) {
      var original = e.target.result;
      var canvas = document.createElement("canvas");
      var ctx = canvas.getContext("2d");
      var image = new Image();
      image.onload = function() {
        var maxWidth = 800;
        var w = image.width;
        var h = image.height;
        if (w > maxWidth) {
          h = Math.round(h * maxWidth / w);
          w = maxWidth;
        }
        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(image, 0, 0, w, h);
        notebookPhotoBase64 = canvas.toDataURL("image/jpeg", 0.6);
        img.src = notebookPhotoBase64;
        preview.style.display = "block";
      };
      image.src = original;
    };
    reader.readAsDataURL(file);
  }

// ===== 纸张评价 =====

          var starred = typeof rec === "object" && rec && rec.starred;
          if (starred) {
            reviewsHtml += '<div style="font-size:13px;color:#555;margin-top:4px;padding-left:12px;border-left:2px solid #e67e22;">&#9733; ' + escapeHtml(text || "") + '</div>';

          '<div style="flex:1;">' +
            '<div style="font-size:15px;font-weight:500;">' + escapeHtml(p.brand) + ' · ' + escapeHtml(p.type) + '</div>' +
(function() {
              var nbHtml = "";
              var linkedNotebooks = [];
              for (var n = 0; n < data.notebooks.length; n++) {
                var nb = data.notebooks[n];

                  linkedNotebooks.push(escapeHtml(nb.code));
                }
              }

                nbHtml = linkedNotebooks.join("、");

            })() +

            '<button class="btn btn-icon btn-sm btn-danger btn-delete-paper" data-id="' + p.id + '" title="删除">&#10005;</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    var editBtns = list.querySelectorAll(".btn-edit-paper");

      });

  function renderPaperReviews() {
    var container = $("paper-reviews-list");
    if (!container) return;
    // 先收集当前输入框的值，避免重新渲染时丢失
    var inputs = container.querySelectorAll(".review-text");
    for (var i = 0; i < inputs.length && i < paperReviewRecords.length; i++) {
      if (typeof paperReviewRecords[i] === "string") {
        paperReviewRecords[i] = inputs[i].value.trim();
      } else if (paperReviewRecords[i]) {
        paperReviewRecords[i].text = inputs[i].value.trim();
      }
    }
    var html = "";
    for (var i = 0; i < paperReviewRecords.length; i++) {
      var rec = paperReviewRecords[i];
      var text = typeof rec === "string" ? rec : (rec ? rec.text : "");
      var starred = typeof rec === "object" && rec && rec.starred;
      html += '<div class="review-row" style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">' +
        '<button class="btn btn-icon btn-sm btn-star" data-ridx="' + i + '" title="标记重点" style="color:' + (starred ? '#e67e22' : '#bbb') + ';font-size:16px;">' + (starred ? '&#9733;' : '&#9734;') + '</button>' +
        '<textarea class="form-input review-text" placeholder="例如：洇墨严重、显色优秀、适合彩墨" rows="1" style="flex:1;font-size:13px;padding:6px 8px;resize:vertical;min-height:32px;" oninput="autoResize(this)">' + escapeHtml(text || "") + '</textarea>' +
        '<button class="btn btn-icon btn-sm btn-danger btn-del-review" data-ridx="' + i + '" title="删除">&#10005;</button>' +
      '</div>';
    }
    container.innerHTML = html;

    var starBtns = container.querySelectorAll(".btn-star");
    for (var i = 0; i < starBtns.length; i++) {
      starBtns[i].addEventListener("click", function(e) {
        e.stopPropagation();
        var ridx = parseInt(this.getAttribute("data-ridx"), 10);
        var rec = paperReviewRecords[ridx];
        if (typeof rec === "string") {
          paperReviewRecords[ridx] = { text: rec, starred: true };
        } else if (rec) {
          rec.starred = !rec.starred;
        }
        renderPaperReviews();
      });
    }

    var delBtns = container.querySelectorAll(".btn-del-review");
    for (var i = 0; i < delBtns.length; i++) {
      delBtns[i].addEventListener("click", function(e) {
        e.stopPropagation();
        var ridx = parseInt(this.getAttribute("data-ridx"), 10);
        paperReviewRecords.splice(ridx, 1);
        renderPaperReviews();
      });
    }

  function savePaper() {
    var brand = $("paper-brand").value.trim();
    var type = $("paper-type").value.trim();
    var weight = $("paper-weight").value.trim();
    var note = $("paper-note").value.trim();
    // 先同步当前输入框的值到数组
    var reviewContainer = $("paper-reviews-list");
    if (reviewContainer) {
      var reviewInputs = reviewContainer.querySelectorAll(".review-text");
      for (var i = 0; i < reviewInputs.length && i < paperReviewRecords.length; i++) {
        if (typeof paperReviewRecords[i] === "string") {
          paperReviewRecords[i] = reviewInputs[i].value.trim();
        } else if (paperReviewRecords[i]) {
          paperReviewRecords[i].text = reviewInputs[i].value.trim();
        }
      }
    }
    var reviews = [];
    for (var i = 0; i < paperReviewRecords.length; i++) {
      var rec = paperReviewRecords[i];
      if (typeof rec === "string") {
        if (rec) reviews.push({ text: rec, starred: false });
      } else if (rec && rec.text) {
        reviews.push({ text: rec.text, starred: !!rec.starred });
      }
    }
    if (!brand) { alert("品牌为必填项"); return; }
    if (!type) { alert("纸种类为必填项"); return; }
    if (editingPaperId) {
      var p = data.papers.find(function(x) { return x.id === editingPaperId; });
      p.brand = brand; p.type = type; p.weight = weight;
      p.reviews = reviews; p.note = note;
    } else {
      data.papers.push({
        id: generateId(), brand: brand, type: type,
        weight: weight, reviews: reviews, note: note
      });
    }
    saveData(); closePaperModal(); renderPapers();
  }

  function deletePaper(id) {
    if (!confirm("确定删除这条纸张记录吗？")) return;
    data.papers = data.papers.filter(function(x) { return x.id !== id; });
    saveData(); renderPapers();
  }



  // ===== 数据导出/导入 =====
  function exportData() {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "彩墨数据_" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var imported = JSON.parse(e.target.result);
        if (!imported.inks || !imported.draws) {
          alert("文件格式不正确，缺少 inks 或 draws 字段");
          return;
        }
        if (!confirm("导入将覆盖当前所有数据，确定继续吗？")) return;
        data = imported;
        // 数据迁移：旧数据兼容
        if (data.draws) {
          for (var i = 0; i < data.draws.length; i++) {
            var d = data.draws[i];
            if (!d.checkedAt) d.checkedAt = {};
            for (var j = 0; j < d.checked.length; j++) {
              var cid = d.checked[j];
              if (!d.checkedAt[cid]) d.checkedAt[cid] = d.createdAt || "";
            }
          }
        }
        if (data.inks) {
          for (var i = 0; i < data.inks.length; i++) {
            var ink = data.inks[i];
            if (!ink.history) {
              ink.history = [{
                label: "购买",
                date: ink.purchaseDate || "",
                capacity: ink.capacity || ""
              }];
              delete ink.purchaseDate;
              delete ink.capacity;
            }
            if (ink.reviews && ink.reviews.length > 0 && typeof ink.reviews[0] === "string") {
              var newReviews = [];
              for (var j = 0; j < ink.reviews.length; j++) {
                newReviews.push({ text: ink.reviews[j], starred: false });
              }
              ink.reviews = newReviews;
            }
            if (ink.note && ink.note.trim() && (!ink.reviews || ink.reviews.length === 0)) {
              ink.reviews = [{ text: ink.note.trim(), starred: false }];
              delete ink.note;
            }
            if (!ink.reviews) ink.reviews = [];
          }
        }
        if (!data.papers) data.papers = [];
        if (!data.notebooks) data.notebooks = [];
      if (!data.notebooks) data.notebooks = [];
        for (var i = 0; i < data.papers.length; i++) {
          var p = data.papers[i];
          if (p.notebook && !p.notebooks) {
            p.notebooks = [p.notebook];
            delete p.notebook;
          }
          if (p.reviews && p.reviews.length > 0 && typeof p.reviews[0] === "string") {
            var newReviews = [];
            for (var j = 0; j < p.reviews.length; j++) {
              newReviews.push({ text: p.reviews[j], starred: false });
            }
            p.reviews = newReviews;
          }
        }
        if (!data.pens) data.pens = [];
        for (var i = 0; i < data.pens.length; i++) {
          var pen = data.pens[i];
          if (pen.reviews && pen.reviews.length > 0 && typeof pen.reviews[0] === "string") {
            var newReviews = [];
            for (var j = 0; j < pen.reviews.length; j++) {
              newReviews.push({ text: pen.reviews[j], starred: false });
            }
            pen.reviews = newReviews;
          }
        }
        if (!data.notebooks) data.notebooks = [];
        saveData();
        if (currentTab === "inventory") renderInventory();
        else if (currentTab === "papers") renderPapers();
        else if (currentTab === "pens") renderPens();
        else renderDraws();
        alert("导入成功！");
      } catch(err) {
        alert("文件解析失败：" + err.message);
      }
    };
    reader.readAsText(file);
  }

  // ===== 抽取中心 =====
  function renderDraws() {
    var list = $("draw-list");
    $("draw-stats").innerHTML = "<span>共 " + data.draws.length + " 个抽取</span>";
    if (data.draws.length === 0) {
      list.innerHTML = '<div class="empty-state">还没有抽取排序，点击上方按钮创建一个吧</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < data.draws.length; i++) {
      var draw = data.draws[i];
      var total = draw.order.length;
      var done = draw.checked.length;
      var pct = total > 0 ? Math.round(done / total * 100) : 0;
      var inkNames = "";
      for (var j = 0; j < Math.min(draw.order.length, 3); j++) {
        var ink = data.inks.find(function(x) { return x.id === draw.order[j]; });
        if (ink) { if (inkNames) inkNames += "、"; inkNames += ink.color; }
      }
      var more = draw.order.length > 3 ? " 等 " + draw.order.length + " 瓶" : "";
      var optText = "";
      html += '<div class="card draw-card" data-draw-id="' + draw.id + '">' +
        '<div class="draw-card-header">' +
          '<div>' +
            '<div class="draw-card-title">' + escapeHtml(draw.name) + '</div>' +
            '<div class="draw-card-meta">' + inkNames + more + " · " + formatDate(draw.createdAt) + "创建" + optText + '</div>' +
          '</div>' +
          '<div style="font-size:20px;font-weight:500;">' + done + "/" + total + '</div>' +
        '</div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
    }
    list.innerHTML = html;

    var cards = list.querySelectorAll(".draw-card");
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener("click", function() {
        openDrawDetail(this.getAttribute("data-draw-id"));
      });
    }
  }

  function openDrawDetail(id) {
    currentDrawId = id;
    hide($("view-draws"));
    show($("view-draw-detail"));
    renderDrawDetail();
  }

  function backToDraws() {
    currentDrawId = null;
    hide($("view-draw-detail"));
    show($("view-draws"));
    renderDraws();
  }

  function renderDrawDetail() {
    var draw = data.draws.find(function(d) { return d.id === currentDrawId; });
    if (!draw) return backToDraws();
    $("detail-title").textContent = draw.name;
    var total = draw.order.length;
    var done = draw.checked.length;
    var pct = total > 0 ? Math.round(done / total * 100) : 0;
    $("detail-meta").textContent = "共 " + total + " 瓶 · 已完成 " + done + " 瓶 · " + formatDate(draw.createdAt) + "创建";
    $("detail-progress").style.width = pct + "%";
    var container = $("detail-list");
    if (total === 0) { container.innerHTML = '<div class="empty-state">该抽取没有彩墨</div>'; return; }

    var html = "";
    for (var idx = 0; idx < draw.order.length; idx++) {
      var id = draw.order[idx];
      var ink = data.inks.find(function(i) { return i.id === id; });
      if (!ink) continue;
      var isChecked = draw.checked.indexOf(id) !== -1;
      var checkMark = isChecked ? "&#10003;" : "&#9675;";
      var checkedClass = isChecked ? " checked" : "";
      html += '<div class="draw-list-item' + checkedClass + '" data-check-id="' + id + '">' +
        '<div class="checkbox">' + checkMark + '</div>' +
        '<div class="ink-color-dot" style="background:' + getInkColor(ink) + ';"></div>' +
        '<div class="ink-info">' +
          '<div class="ink-brand">' + (idx + 1) + ". " + escapeHtml(ink.brand) + " · " + escapeHtml(ink.color) + '</div>' +
          '<div class="ink-meta">' + escapeHtml(formatCapacity((getLatestHistory(ink) || {}).capacity)) + " · " + (isChecked && draw.checkedAt[id] ? formatDate(draw.checkedAt[id]) : formatDate((getLatestHistory(ink) || {}).date)) + '</div>' +
        '</div>' +
        '<span class="ink-status ' + (ink.status === "active" ? "status-active" : "status-used") + '">' + (ink.status === "active" ? "在用" : "用完") + '</span>' +
      '</div>';
    }
    container.innerHTML = html;

    var items = container.querySelectorAll(".draw-list-item");
    for (var i = 0; i < items.length; i++) {
      items[i].addEventListener("click", function() {
        toggleCheck(this.getAttribute("data-check-id"));
      });
    }
  }

  function toggleCheck(inkId) {
    var draw = data.draws.find(function(d) { return d.id === currentDrawId; });
    if (!draw) return;
    var idx = draw.checked.indexOf(inkId);
    if (idx >= 0) {
      // 取消勾选：移除标记和日期，保持顺序位置
      draw.checked.splice(idx, 1);
      delete draw.checkedAt[inkId];
    } else {
      // 勾选：标记为已使用，记录使用日期，并移到列表末尾
      draw.checked.push(inkId);
      draw.checkedAt[inkId] = new Date().toISOString().split("T")[0];
      var orderIdx = draw.order.indexOf(inkId);
      if (orderIdx !== -1) {
        draw.order.splice(orderIdx, 1);
        draw.order.push(inkId);
      }
    }
    saveData(); renderDrawDetail();
  }

  function resetDraw() {
    if (!confirm("确定重置该抽取的所有进度吗？")) return;
    var draw = data.draws.find(function(d) { return d.id === currentDrawId; });
    if (draw) { draw.checked = []; saveData(); renderDrawDetail(); }
  }

  function deleteCurrentDraw() {
    if (!confirm("确定删除这个抽取排序吗？")) return;
    data.draws = data.draws.filter(function(d) { return d.id !== currentDrawId; });
    saveData(); backToDraws();
  }

  function exportDraw() {
    var draw = data.draws.find(function(d) { return d.id === currentDrawId; });
    if (!draw) return;
    var today = new Date().toISOString().split("T")[0];
    var md = "# " + escapeHtml(draw.name) + "\n\n";
    md += "- 创建日期：" + formatDate(draw.createdAt) + "\n";
    md += "- 导出日期：" + formatDate(today) + "\n";
    md += "- 总计：" + draw.order.length + " 瓶\n";
    md += "- 已完成：" + draw.checked.length + " 瓶\n";
    md += "- 完成率：" + (draw.order.length > 0 ? Math.round(draw.checked.length / draw.order.length * 100) : 0) + "%\n\n";
    md += "| 序号 | 状态 | 品牌 | 颜色 | 色系 | 容量 | 购买日期 | 使用日期 |\n";
    md += "|------|------|------|------|------|------|----------|----------|\n";
    for (var i = 0; i < draw.order.length; i++) {
      var id = draw.order[i];
      var ink = data.inks.find(function(x) { return x.id === id; });
      if (!ink) continue;
      var isChecked = draw.checked.indexOf(id) !== -1;
      var status = isChecked ? "✓" : "○";
      var family = FAMILY_NAMES[ink.colorFamily] || ink.colorFamily || "";
      var usedDate = isChecked ? formatDate(draw.checkedAt[id] || "") : "";
      md += "| " + (i + 1) + " | " + status + " | " + escapeHtml(ink.brand) + " | " + escapeHtml(ink.color) + " | " + family + " | " + escapeHtml(formatCapacity((getLatestHistory(ink) || {}).capacity)) + " | " + formatDate((getLatestHistory(ink) || {}).date) + " | " + usedDate + " |\n";
    }
    md += "\n---\n*由彩墨管理与抽取工具导出*\n";
    var blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "抽取记录_" + draw.name + "_" + today + ".md";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  var pendingRefreshDraw = null;
  var pendingValidOrder = null;
  var pendingValidChecked = null;
  var pendingRemovedCount = 0;
  var pendingRemovedNames = [];

  function refreshDraw() {
    var draw = data.draws.find(function(d) { return d.id === currentDrawId; });
    if (!draw) return;

    var removedCount = 0;
    var removedNames = [];

    // 过滤：保留"在用"的墨水，以及"已勾选（本次已使用）即使状态变为用完"的墨水
    var validOrder = [];
    for (var i = 0; i < draw.order.length; i++) {
      var id = draw.order[i];
      var ink = data.inks.find(function(x) { return x.id === id; });
      var isChecked = draw.checked.indexOf(id) !== -1;
      if (ink && (ink.status === "active" || isChecked)) {
        validOrder.push(id);
      } else {
        removedCount++;
        if (ink) removedNames.push(ink.brand + "·" + ink.color);
      }
    }

    // 同步 checked：只要墨水还在 validOrder 中就保留勾选状态
    var validChecked = [];
    for (var i = 0; i < draw.checked.length; i++) {
      var id = draw.checked[i];
      if (validOrder.indexOf(id) !== -1) {
        validChecked.push(id);
      }
    }

    // 找出所有在用但不在当前抽取中的墨水
    var newInks = [];
    for (var i = 0; i < data.inks.length; i++) {
      var ink = data.inks[i];
      if (ink.status === "active" && draw.inkIds.indexOf(ink.id) === -1) {
        newInks.push(ink);
      }
    }

    if (newInks.length > 0) {
      pendingRefreshDraw = draw;
      pendingValidOrder = validOrder;
      pendingValidChecked = validChecked;
      pendingRemovedCount = removedCount;
      pendingRemovedNames = removedNames;
      renderRefreshNewInks(newInks);
      showModal("modal-refresh");
    } else {
      finishRefresh(draw, validOrder, validChecked, removedCount, removedNames, []);
    }
  }

  function renderRefreshNewInks(newInks) {
    var container = $("refresh-new-inks-list");
    var html = '<div style="font-size:13px;color:#666;margin-bottom:12px;">以下在用墨水不在当前抽取中，是否加入本次刷新？</div>';
    for (var i = 0; i < newInks.length; i++) {
      var ink = newInks[i];
      html += '<label class="option-item" style="cursor:pointer;">' +
        '<input type="checkbox" class="refresh-ink-checkbox" value="' + ink.id + '" checked>' +
        '<div class="ink-color-dot" style="width:12px;height:12px;background:' + getInkColor(ink) + ';flex-shrink:0;"></div>' +
        '<span>' + escapeHtml(ink.brand) + " · " + escapeHtml(ink.color) + " · " + escapeHtml(formatCapacity((getLatestHistory(ink) || {}).capacity)) + '</span>' +
      '</label>';
    }
    container.innerHTML = html;
  }

  function confirmAddAndRefresh() {
    var checkboxes = document.querySelectorAll(".refresh-ink-checkbox:checked");
    var selectedIds = [];
    for (var i = 0; i < checkboxes.length; i++) {
      selectedIds.push(checkboxes[i].value);
    }
    hideModal("modal-refresh");

    for (var i = 0; i < selectedIds.length; i++) {
      if (pendingRefreshDraw.inkIds.indexOf(selectedIds[i]) === -1) {
        pendingRefreshDraw.inkIds.push(selectedIds[i]);
      }
    }

    finishRefresh(pendingRefreshDraw, pendingValidOrder, pendingValidChecked, pendingRemovedCount, pendingRemovedNames, selectedIds);
    pendingRefreshDraw = null;
    pendingValidOrder = null;
    pendingValidChecked = null;
  }

  function skipRefresh() {
    hideModal("modal-refresh");
    finishRefresh(pendingRefreshDraw, pendingValidOrder, pendingValidChecked, pendingRemovedCount, pendingRemovedNames, []);
    pendingRefreshDraw = null;
    pendingValidOrder = null;
    pendingValidChecked = null;
  }

  function finishRefresh(draw, validOrder, validChecked, removedCount, removedNames, newAddedIds) {
    var usedIds = [];
    var unusedIds = [];
    for (var i = 0; i < validOrder.length; i++) {
      var id = validOrder[i];
      if (validChecked.indexOf(id) !== -1) {
        usedIds.push(id);
      } else {
        unusedIds.push(id);
      }
    }

    for (var i = 0; i < newAddedIds.length; i++) {
      unusedIds.push(newAddedIds[i]);
    }

    var newUnusedOrder = smartSort(unusedIds);
    draw.order = newUnusedOrder.concat(usedIds);
    draw.checked = validChecked;

    saveData(); renderDrawDetail();

    var msg = "已刷新排序";
    if (removedCount > 0) {
      msg += "，移除了 " + removedCount + " 瓶已用完/已删除的墨水";
      if (removedNames.length > 0 && removedNames.length <= 3) {
        msg += "（" + removedNames.join("、") + "）";
      }
    }
    if (newAddedIds.length > 0) {
      msg += "，新增 " + newAddedIds.length + " 瓶墨水";
    }
    alert(msg);
  }

  // ===== 新建抽取 =====
  function openDrawModal() {
    var activeInks = data.inks.filter(function(i) { return i.status === "active"; });
    if (activeInks.length === 0) { alert("没有在用状态的彩墨，无法创建抽取"); return; }
    selectedInkIds = [];
    for (var i = 0; i < activeInks.length; i++) selectedInkIds.push(activeInks[i].id);
    $("draw-name").value = "";
    $("selected-count").textContent = selectedInkIds.length;
    renderInkSelector();
    showModal("modal-draw");
  }

  function renderInkSelector() {
    var selector = $("draw-ink-selector");
    var html = "";
    for (var i = 0; i < data.inks.length; i++) {
      var ink = data.inks[i];
      var isSelected = selectedInkIds.indexOf(ink.id) !== -1;
      html += '<div class="ink-chip ' + (isSelected ? "selected" : "") + '" data-chip-id="' + ink.id + '">' +
        '<div class="ink-color-dot" style="width:12px;height:12px;background:' + getInkColor(ink) + ';"></div>' +
        escapeHtml(ink.brand) + " " + escapeHtml(ink.color) +
      '</div>';
    }
    selector.innerHTML = html;

    var chips = selector.querySelectorAll(".ink-chip");
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener("click", function() {
        var id = this.getAttribute("data-chip-id");
        var idx = selectedInkIds.indexOf(id);
        if (idx !== -1) {
          selectedInkIds.splice(idx, 1);
          this.classList.remove("selected");
        } else {
          selectedInkIds.push(id);
          this.classList.add("selected");
        }
        $("selected-count").textContent = selectedInkIds.length;
      });
    }
  }

  function closeDrawModal() {
    hideModal("modal-draw");
  }

  function createDraw() {
    var name = $("draw-name").value.trim();
    if (!name) { alert("请输入抽取名称"); return; }
    if (selectedInkIds.length === 0) { alert("请至少选择一瓶彩墨"); return; }

    var order = smartSort(selectedInkIds);
    data.draws.push({
      id: generateId(), name: name,
      createdAt: new Date().toISOString().split("T")[0],
      inkIds: selectedInkIds.slice(),
      order: order,
      checked: [],
      checkedAt: {}
    });
    saveData(); closeDrawModal();
    if (currentTab === "draws") renderDraws(); else switchTab("draws");
  }

  // ===== 全局事件绑定 =====
  document.addEventListener("DOMContentLoaded", function() {
    $("tab-draws").addEventListener("click", function() { switchTab("draws"); });
    $("tab-inventory").addEventListener("click", function() { switchTab("inventory"); });
    $("tab-pens").addEventListener("click", function() { switchTab("pens"); });
    $("tab-papers").addEventListener("click", function() { switchTab("papers"); });
    $("tab-notebooks").addEventListener("click", function() { switchTab("notebooks"); });

    $("btn-add-ink").addEventListener("click", function() { openInkModal(); });
    $("btn-cancel-ink").addEventListener("click", closeInkModal);
    $("btn-save-ink").addEventListener("click", saveInk);

    $("btn-add-draw").addEventListener("click", openDrawModal);
    $("btn-cancel-draw").addEventListener("click", closeDrawModal);
    $("btn-create-draw").addEventListener("click", createDraw);

    $("btn-back").addEventListener("click", backToDraws);
    $("btn-reset").addEventListener("click", resetDraw);
    $("btn-delete-draw").addEventListener("click", deleteCurrentDraw);
    $("btn-refresh").addEventListener("click", refreshDraw);
    $("btn-confirm-add-refresh").addEventListener("click", confirmAddAndRefresh);
    $("btn-skip-refresh").addEventListener("click", skipRefresh);
    $("modal-refresh").addEventListener("click", function(e) {
      if (e.target === this) skipRefresh();
    });
    $("btn-export-draw").addEventListener("click", exportDraw);

    $("btn-add-paper").addEventListener("click", function() { openPaperModal(); });

    $("btn-add-notebook").addEventListener("click", function() { openNotebookModal(); });
    $("btn-cancel-notebook").addEventListener("click", closeNotebookModal);
    $("btn-save-notebook").addEventListener("click", saveNotebook);
    $("notebook-photo").addEventListener("change", handleNotebookPhoto);
    $("modal-notebook").addEventListener("click", function(e) {
      if (e.target === this) closeNotebookModal();
    });

    $("btn-add-pen").addEventListener("click", function() { openPenModal(); });
    $("btn-cancel-pen").addEventListener("click", closePenModal);
    $("btn-save-pen").addEventListener("click", savePen);
    $("btn-add-pen-review").addEventListener("click", function() {
      penReviewRecords.push("");
      renderPenReviews();
    });
    $("modal-pen").addEventListener("click", function(e) {
      if (e.target === this) closePenModal();
    });
    $("btn-cancel-paper").addEventListener("click", closePaperModal);
    $("btn-save-paper").addEventListener("click", savePaper);
    $("btn-add-review").addEventListener("click", function() {
      paperReviewRecords.push("");
      renderPaperReviews();
    });

    $("modal-paper").addEventListener("click", function(e) {
      if (e.target === this) closePaperModal();
    });

    $("modal-ink").addEventListener("click", function(e) {
      if (e.target === this) closeInkModal();
    });
    $("modal-draw").addEventListener("click", function(e) {
      if (e.target === this) closeDrawModal();
    });

    $("ink-family").addEventListener("change", updateColorInputStyle);

    $("ink-brand-select").addEventListener("change", function() {
      if (this.value === "__new__") {
        $("ink-brand-input").style.display = "block";
        $("ink-brand-input").focus();
      } else {
        $("ink-brand-input").style.display = "none";
      }
    });

    $("btn-add-history").addEventListener("click", function() { addHistoryRecord(); });
    $("btn-add-ink-review").addEventListener("click", function() {
      inkReviewRecords.push("");
      renderInkReviews();
    });

    $("filter-family").addEventListener("change", renderInventory);
    $("filter-brand").addEventListener("change", renderInventory);
    $("sort-mode").addEventListener("change", renderInventory);

    $("btn-export").addEventListener("click", exportData);
    $("btn-import").addEventListener("click", function() {
      $("import-file").click();
    });
    $("import-file").addEventListener("change", function(e) {
      if (e.target.files.length > 0) {
        importData(e.target.files[0]);
        e.target.value = "";
      }
    });

    loadData();
    switchTab("draws");
  });

  window.onerror = function(msg, url, line) {
    console.error("JS错误: " + msg + " (行 " + line + ")");
    return false;
  };

  window.addEventListener("beforeunload", function() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e) {}
  });
})();
</script>
<div id="modal-refresh" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">发现新墨水</div>
    <div id="refresh-new-inks-list"></div>
    <div class="form-actions">
      <button class="btn" id="btn-skip-refresh">跳过，直接刷新</button>
      <button class="btn btn-primary" id="btn-confirm-add-refresh">确认加入并刷新</button>
    </div>
  </div>
</div>

</body>
</html>
