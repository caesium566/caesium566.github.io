name: game-events-monitor
on:
  schedule:
    - cron: '0 6 1,15 * *'   # 每月1、15号 UTC 06:00（北京时间 14:00）
  workflow_dispatch:          # 允许手动触发（仓库 Actions 页点 Run workflow）

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official feeds and extract events
        run: python scripts/monitor.py
      - name: Commit events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update game events"
            git push
          fi
